<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0a0a1a;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }
        canvas {
            border: 3px solid #00d4ff;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a3e 100%);
        }
        #score {
            font-size: 24px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }
        #message {
            font-size: 18px;
            margin-top: 15px;
            color: #aaa;
        }
        .controls {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="score">Счёт: 0</div>
    <canvas id="gameCanvas" width="500" height="600"></canvas>
    <div id="message">Стрелки — движение, Пробел — стрельба</div>
    <div class="controls">Уничтожайте врагов, избегайте столкновений!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Игрок
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            width: 40,
            height: 40,
            speed: 5,
            color: '#00d4ff'
        };

        // Массивы для объектов
        let bullets = [];
        let enemies = [];
        let particles = [];

        // Игровые переменные
        let score = 0;
        let gameStarted = false;
        let gameOver = false;
        let keys = {};
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 60; // Кадров между спавном врагов

        // Управление клавиатурой
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (!gameStarted && !gameOver) {
                gameStarted = true;
                document.getElementById('message').textContent = '';
            }
            
            // Стрельба по пробелу
            if (e.code === 'Space' && gameStarted && !gameOver) {
                shoot();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Стрельба
        function shoot() {
            bullets.push({
                x: player.x + player.width / 2 - 2,
                y: player.y,
                width: 4,
                height: 15,
                speed: 7,
                color: '#ffff00'
            });
        }

        // Спавн врага
        function spawnEnemy() {
            const size = 30 + Math.random() * 20;
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: 2 + Math.random() * 2,
                color: `hsl(${Math.random() * 60}, 100%, 50%)` // Красные/оранжевые оттенки
            });
        }

        // Создание частиц взрыва
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color: color
                });
            }
        }

        // Проверка столкновения
        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }

        // Отрисовка игрока (треугольник-корабль)
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();
            
            // Двигатель
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(player.x + player.width / 2 - 5, player.y + player.height, 10, 5);
        }

        // Отрисовка пули
        function drawBullet(bullet) {
            ctx.fillStyle = bullet.color;
            ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            // Свечение
            ctx.shadowBlur = 10;
            ctx.shadowColor = bullet.color;
            ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            ctx.shadowBlur = 0;
        }

        // Отрисовка врага
        function drawEnemy(enemy) {
            ctx.fillStyle = enemy.color;
            ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            // Глаза
            ctx.fillStyle = 'white';
            ctx.fillRect(enemy.x + 8, enemy.y + 10, 6, 6);
            ctx.fillRect(enemy.x + enemy.width - 14, enemy.y + 10, 6, 6);
        }

        // Отрисовка частиц
        function drawParticle(particle) {
            ctx.fillStyle = particle.color;
            ctx.globalAlpha = particle.life / 30;
            ctx.fillRect(particle.x, particle.y, 3, 3);
            ctx.globalAlpha = 1;
        }

        // Основной игровой цикл
        function update() {
            if (gameOver) return;

            // Очистка экрана
            ctx.fillStyle = 'rgba(10, 10, 26, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!gameStarted) {
                drawPlayer();
                requestAnimationFrame(update);
                return;
            }

            // Движение игрока
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            if (keys['ArrowUp'] && player.y > 0) {
                player.y -= player.speed;
            }
            if (keys['ArrowDown'] && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }

            // Обновление пуль
            bullets.forEach((bullet, index) => {
                bullet.y -= bullet.speed;
                if (bullet.y < 0) {
                    bullets.splice(index, 1);
                }
            });

            // Спавн врагов
            enemySpawnTimer++;
            if (enemySpawnTimer > enemySpawnInterval) {
                spawnEnemy();
                enemySpawnTimer = 0;
                // Увеличиваем сложность
                if (enemySpawnInterval > 20) {
                    enemySpawnInterval -= 0.5;
                }
            }

            // Обновление врагов
            enemies.forEach((enemy, enemyIndex) => {
                enemy.y += enemy.speed;

                // Враг ушел за экран
                if (enemy.y > canvas.height) {
                    enemies.splice(enemyIndex, 1);
                    return;
                }

                // Столкновение с игроком
                if (checkCollision(player, enemy)) {
                    createExplosion(player.x + player.width / 2, player.y + player.height / 2, player.color);
                    endGame();
                    return;
                }

                // Проверка попадания пуль
                bullets.forEach((bullet, bulletIndex) => {
                    if (checkCollision(bullet, enemy)) {
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
                        bullets.splice(bulletIndex, 1);
                        enemies.splice(enemyIndex, 1);
                        score += 10;
                        document.getElementById('score').textContent = 'Счёт: ' + score;
                    }
                });
            });

            // Обновление частиц
            particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life--;
                if (particle.life <= 0) {
                    particles.splice(index, 1);
                }
            });

            // Отрисовка
            drawPlayer();
            bullets.forEach(drawBullet);
            enemies.forEach(drawEnemy);
            particles.forEach(drawParticle);

            requestAnimationFrame(update);
        }

        function endGame() {
            gameOver = true;
            document.getElementById('message').textContent = 
                'Игра окончена! Счёт: ' + score + '. Обновите страницу для рестарта.';
            document.getElementById('message').style.color = '#ff4757';
        }

        // Запуск игры
        update();
    </script>
</body>
</html>
