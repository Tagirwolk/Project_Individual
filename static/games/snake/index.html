<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }
        canvas {
            border: 3px solid #00ff88;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        #score {
            font-size: 24px;
            margin-bottom: 15px;
        }
        #message {
            font-size: 18px;
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="score">Счёт: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="message">Нажмите любую стрелку для начала</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameStarted = false;
        let gameOver = false;

        // Отрисовка игрового поля
        function draw() {
            if (gameOver) return;

            // Движение змейки
            if (gameStarted) {
                const head = { x: snake[0].x + dx, y: snake[0].y + dy };

                // Проверка столкновения со стеной
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    endGame(); return;
                }

                // Проверка столкновения с собой
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        endGame(); return;
                    }
                }

                snake.unshift(head);

                // Проверка поедания еды
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    document.getElementById('score').textContent = 'Счёт: ' + score;
                    placeFood();
                } else {
                    snake.pop();
                }
            }

            // Очистка экрана
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Отрисовка еды
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2, 0, Math.PI * 2
            );
            ctx.fill();

            // Отрисовка змейки
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#00ff88' : '#00cc6a';
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2, gridSize - 2
                );
            });
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function endGame() {
            gameOver = true;
            document.getElementById('message').textContent =
                'Игра окончена! Счёт: ' + score + '. Обновите страницу для рестарта.';
            document.getElementById('message').style.color = '#ff4757';
        }

        // Управление
        document.addEventListener('keydown', (event) => {
            if (gameOver) return;

            switch (event.key) {
                case 'w':    if (dy !== 1)  { dx = 0; dy = -1; } break;
                case 's':  if (dy !== -1) { dx = 0; dy = 1;  } break;
                case 'a':  if (dx !== 1)  { dx = -1; dy = 0; } break;
                case 'd': if (dx !== -1) { dx = 1; dy = 0;  } break;
                case 'ArrowUp':    if (dy !== 1)  { dx = 0; dy = -1; } break;
                case 'ArrowDown':  if (dy !== -1) { dx = 0; dy = 1;  } break;
                case 'ArrowLeft':  if (dx !== 1)  { dx = -1; dy = 0; } break;
                case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0;  } break;
            }

            if (!gameStarted) {
                gameStarted = true;
                document.getElementById('message').textContent = '';
            }
        });

        // Игровой цикл (10 кадров в секунду)
        setInterval(draw, 100);
    </script>
</body>
</html>
